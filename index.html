<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="應收帳款">
  <title>應收帳款總覽</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      color: #18273b;
      background: #f4f6fa;
      --navy: #192b45;
      --muted: #54647b;
      --border: #dfe5ef;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #326bb5; outline-offset: 3px; }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-bottom: calc(104px + env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
    }

    h1 { margin: 0 0 16px; font-size: 28px; line-height: 1.25; }

    .summary {
      margin-bottom: 24px;
      padding: 20px;
      color: #fff;
      background: var(--navy);
      border-radius: 18px;
    }

    .summary h2 { margin: 0 0 8px; color: #e0e8f3; font-size: 15px; font-weight: 600; }
    .summary strong, .amount, .subtotal { font-variant-numeric: tabular-nums; }
    .summary strong {
      display: block;
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .month { margin-bottom: 24px; }
    .month:last-child { margin-bottom: 0; }
    .month-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 12px;
      margin: 0 2px 8px;
    }
    .month-heading h2 { margin: 0; font-size: 18px; }
    .subtotal { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

    .items { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .item {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding: 6px 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .paid-toggle {
      display: grid;
      place-items: center;
      flex: 0 0 44px;
      min-height: 48px;
      align-content: center;
      gap: 2px;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }

    .paid-toggle input { width: 20px; height: 20px; margin: 0; accent-color: var(--navy); }
    .detail { flex: 1; min-width: 0; padding: 4px; }
    time { display: block; color: var(--muted); font-size: 13px; }
    .amount { display: block; margin-top: 2px; font-size: 20px; overflow-wrap: anywhere; }
    .paid .amount { color: var(--muted); text-decoration: line-through; }

    .row-button {
      min-width: 44px;
      min-height: 44px;
      padding: 0 4px;
      color: #32455f;
      background: #f0f3f8;
      border: 0;
      border-radius: 9px;
      font-size: 13px;
    }
    .row-button:last-child { color: #8c3434; }

    .empty {
      margin: 0;
      padding: 28px 12px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: center;
    }

    .add, .primary {
      color: #fff;
      background: var(--navy);
      border: 0;
      font-weight: 700;
    }
    .add {
      position: fixed;
      right: max(16px, env(safe-area-inset-right), calc((100vw - 608px) / 2));
      bottom: calc(16px + env(safe-area-inset-bottom));
      min-height: 48px;
      padding: 12px 18px;
      border-radius: 14px;
      box-shadow: 0 5px 16px #192b4533;
    }
    .add:disabled { opacity: .55; cursor: default; }

    dialog {
      width: min(calc(100% - 32px), 420px);
      max-height: calc(100% - 32px);
      padding: 20px;
      color: inherit;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 16px 48px #192b4540;
    }
    dialog::backdrop { background: #16223880; }
    dialog h2 { margin: 0 0 16px; font-size: 21px; }
    .field { display: grid; gap: 6px; margin-bottom: 14px; }
    .field label { color: #32455f; font-size: 14px; font-weight: 600; }
    .field input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 8px 10px;
      color: inherit;
      background: #fff;
      border: 1px solid #a8b4c6;
      border-radius: 9px;
      font-size: 16px;
    }
    .buttons { display: flex; gap: 8px; margin-top: 18px; }
    .buttons button { flex: 1; min-height: 44px; padding: 8px; border: 0; border-radius: 9px; }
    .secondary { color: inherit; background: #edf1f7; }
    .error { margin: 8px 0 16px; color: #8c3434; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>應收帳款總覽</h1>
    <section class="summary" aria-labelledby="summaryTitle">
      <h2 id="summaryTitle">所有月份未收款合計</h2>
      <strong id="grandTotal" aria-live="polite">$0</strong>
    </section>
    <p id="storageError" class="error" role="alert" hidden></p>
    <div id="groups"></div>
    <button type="button" class="add" id="add">＋ 新增帳款</button>
  </main>

  <dialog id="dialog" aria-labelledby="formTitle">
    <form id="form">
      <h2 id="formTitle">新增帳款</h2>
      <div class="field">
        <label for="date">應收日期（2026～2099）</label>
        <input id="date" type="date" min="2026-01-01" max="2099-12-31" required>
      </div>
      <div class="field">
        <label for="amount">應收金額</label>
        <input id="amount" type="number" inputmode="numeric" min="0" step="1" required>
      </div>
      <p id="formError" class="error" role="alert" hidden></p>
      <div class="buttons">
        <button type="button" class="secondary" id="cancel">取消</button>
        <button type="submit" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <script>
    'use strict';

    const storageKey = 'receivables_v2';
    const legacyKey = 'receivables_v1';
    const firstDate = '2026-01-01';
    const lastDate = '2099-12-31';
    const numberFormat = new Intl.NumberFormat('zh-TW');
    const get = id => document.getElementById(id);
    const formatMoney = value => '$' + numberFormat.format(value);
    const dialog = get('dialog');
    const dateField = get('date');
    const amountField = get('amount');
    let records = [];
    let editing = null;
    let canSave = true;

    function showError(element, message) {
      element.textContent = message;
      element.hidden = !message;
    }

    function loadRecords() {
      try {
        // A saved v2 array, including an empty one, always takes precedence.
        const saved = localStorage.getItem(storageKey) ?? localStorage.getItem(legacyKey);
        const parsed = saved === null ? [] : JSON.parse(saved);
        if (!Array.isArray(parsed)) throw new Error('Expected an array of receipts');
        records = parsed;
        canSave = true;
        showError(get('storageError'), '');
      } catch {
        canSave = false;
        showError(get('storageError'), '無法讀取帳款。請確認 Safari 允許儲存網站資料，再重新整理。');
      }
      get('add').disabled = !canSave;
      render();
    }

    function saveRecords(nextRecords) {
      if (!canSave) return false;
      try {
        localStorage.setItem(storageKey, JSON.stringify(nextRecords));
        records = nextRecords;
        return true;
      } catch {
        const message = '無法儲存帳款。請確認 Safari 的網站資料設定或儲存空間後再試一次。';
        if (dialog.open) showError(get('formError'), message);
        else window.alert(message);
        return false;
      }
    }

    function validDate(value) {
      if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const date = new Date(value + 'T00:00:00Z');
      return Number.isFinite(date.getTime()) && date.toISOString().slice(0, 10) === value;
    }

    function render() {
      const view = records
        .map((record, index) => ({ record, index, amount: Number(record?.amount) }))
        .filter(({ record, amount }) => validDate(record?.date) && Number.isInteger(amount) && amount >= 0)
        .sort((a, b) => a.record.date.localeCompare(b.record.date));

      const months = new Map();
      let grandTotal = 0n;
      for (const entry of view) {
        const key = entry.record.date.slice(0, 7);
        if (!months.has(key)) months.set(key, { entries: [], total: 0n });
        const month = months.get(key);
        month.entries.push(entry);
        if (!entry.record.paid) {
          const amount = BigInt(entry.amount);
          month.total += amount;
          grandTotal += amount;
        }
      }

      const groups = get('groups');
      get('grandTotal').textContent = formatMoney(grandTotal);
      if (!months.size) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = canSave ? '目前沒有帳款。點「新增帳款」開始。' : '目前無法顯示帳款。';
        groups.replaceChildren(empty);
        return;
      }

      const sections = document.createDocumentFragment();
      for (const [key, month] of months) {
        const section = document.createElement('section');
        section.className = 'month';
        const header = document.createElement('header');
        header.className = 'month-heading';
        const heading = document.createElement('h2');
        heading.textContent = `${key.slice(0, 4)} 年 ${Number(key.slice(5))} 月`;
        const subtotal = document.createElement('p');
        subtotal.className = 'subtotal';
        subtotal.textContent = '未收款小計 ' + formatMoney(month.total);
        const list = document.createElement('ul');
        list.className = 'items';
        for (const entry of month.entries) list.append(renderItem(entry));
        header.append(heading, subtotal);
        section.append(header, list);
        sections.append(section);
      }
      groups.replaceChildren(sections);
    }

    function renderItem({ record, index, amount }) {
      const item = document.createElement('li');
      item.className = record.paid ? 'item paid' : 'item';

      const toggle = document.createElement('label');
      toggle.className = 'paid-toggle';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = `paid-${index}`;
      checkbox.checked = Boolean(record.paid);
      checkbox.disabled = !canSave;
      checkbox.setAttribute('aria-label', `${record.date} ${formatMoney(amount)} 已收款`);
      checkbox.addEventListener('change', () => {
        const next = records.slice();
        next[index] = { ...record, paid: checkbox.checked };
        if (saveRecords(next)) {
          const focused = document.activeElement === checkbox;
          render();
          if (focused) get(`paid-${index}`).focus({ preventScroll: true });
        } else {
          checkbox.checked = Boolean(record.paid);
        }
      });
      const status = document.createElement('span');
      status.textContent = record.paid ? '已收' : '未收';
      toggle.append(checkbox, status);

      const detail = document.createElement('div');
      detail.className = 'detail';
      const date = document.createElement('time');
      date.dateTime = record.date;
      date.textContent = record.date;
      const money = document.createElement('strong');
      money.className = 'amount';
      money.textContent = formatMoney(amount);
      detail.append(date, money);

      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'row-button';
      edit.textContent = '修改';
      edit.disabled = !canSave;
      edit.addEventListener('click', () => openForm(record));

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'row-button';
      remove.textContent = '刪除';
      remove.disabled = !canSave;
      remove.addEventListener('click', () => {
        if (!window.confirm(`確定刪除 ${record.date} 的 ${formatMoney(amount)} 帳款？`)) return;
        const next = records.slice();
        next.splice(index, 1);
        if (saveRecords(next)) render();
      });

      item.append(toggle, detail, edit, remove);
      return item;
    }

    function openForm(record = null) {
      editing = record;
      get('formTitle').textContent = record ? '修改帳款' : '新增帳款';
      showError(get('formError'), '');
      const today = new Date();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      const todayDate = `${today.getFullYear()}-${month}-${day}`;
      const defaultDate = todayDate < firstDate ? firstDate : todayDate > lastDate ? lastDate : todayDate;
      // Allow an existing date outside the current range to stay as it is.
      dateField.min = record?.date < firstDate ? record.date : firstDate;
      dateField.max = record?.date > lastDate ? record.date : lastDate;
      dateField.value = record?.date ?? defaultDate;
      amountField.value = record?.amount ?? '';
      dialog.showModal();
    }

    get('add').addEventListener('click', () => openForm());
    get('cancel').addEventListener('click', () => dialog.close());

    get('form').addEventListener('submit', event => {
      event.preventDefault();
      const date = dateField.value;
      const amount = Number(amountField.value);
      const inRange = date >= firstDate && date <= lastDate;
      if (!validDate(date) || (!inRange && date !== editing?.date)) {
        showError(get('formError'), '請輸入 2026～2099 年的有效日期。');
        dateField.focus();
        return;
      }
      if (amountField.value === '' || !Number.isSafeInteger(amount) || amount < 0) {
        showError(get('formError'), '請輸入有效的非負整數金額。');
        amountField.focus();
        return;
      }

      const next = records.slice();
      if (editing) {
        const index = records.indexOf(editing);
        if (index === -1) {
          showError(get('formError'), '帳款資料已更新。請關閉表單後重新開啟。');
          return;
        }
        next[index] = { ...editing, date, amount };
      } else {
        const id = globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        next.push({ id, date, amount, paid: false });
      }
      if (saveRecords(next)) {
        dialog.close();
        render();
      }
    });

    window.addEventListener('storage', event => {
      if (event.key === storageKey || event.key === legacyKey || event.key === null) loadRecords();
    });

    loadRecords();
  </script>
</body>
</html>
